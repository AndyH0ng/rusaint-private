[package]
name = "rusaint-mcp"
description = "MCP server for Soongsil University cafeteria menus and the central library"
version.workspace = true
keywords.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
readme.workspace = true

[dependencies]
axum = "0.8"
base64 = "0.23"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
tower = { version = "0.5", features = ["util"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rpassword = "7.5"
rmcp = { version = "=3.5.1", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
rusaint = { workspace = true }
rusaint-library = { path = "../rusaint-library" }
rusaint-lms = { path = "../rusaint-lms" }
rusaint-meal = { path = "../rusaint-meal" }
rusaint-path = { path = "../rusaint-path" }
rusaint-sso = { path = "../rusaint-sso" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
